me.com/hok/ja/heroes/dian-wei","2026-11-21閲覧／装備原データ2026-08-28"],["11/17パッチ変更対象一覧","https://hub-game.com/hok/en/patches","2026-11-21閲覧／典韋は変更9体に含まれない"]],"verified":"2026-11-21：パッシブ・S1/S2/ULTとCD・Lv別基本値、定性対面、過去の装備セットを外部資料で照合。最新国際版実機、公式個別動画、5レーンの網羅的実績、対面統計は未検証。"},{"name":"Diaochan","id":28},{"name":"Dolia","id":29},{"name":"Donghuang","id":30,"jp":"東皇太一","lane":"Roam","role":"Support","tags":["単体拘束","対キャリー","前衛"],"plan":"敵の主力を見極めて、味方が処理できるタイミングで拘束を使う。","weak":"確実なフォローがないところで主力スキルを浪費しない。","compare":"ヤドランの強制拘束に近い。"},{"name":"Dr Bian","id":31},{"name":"Dun","id":32},{"name":"Dunshan","id":33,"jp":"イージス","aliases":["盾山","Dunshan","Shield Eternal"],"lane":"Roam","role":"Tank / Support","tags":["味方シールド","合体防護","敵の投げ飛ばし","飛び道具対策","タワー修復"],"plan":"S1で味方と合体してシールドを配分し護衛、または味方タワーを砲台化して修復。S2で敵を背後に投げ、ULTで射撃を落として敵を押し返す。味方の動きに合わせる守護型ローム。","weak":"S1の味方防護中は移動を味方が操作し、S2が敵ヒーローを投げなくなる。投げたいときはS1前にS2を使う。シールドへの追加ダメージを持つ伽羅やCC解除の荘子に注意。","source":"https://hub-game.com/hok/en/heroes/dunshan","skills":[["パッシブ｜移動する山（Moving Mountain）","通常攻撃に基礎135（ヒーローLv1）＋追加HP2.7%の物理ダメージ。S1で味方をかばっている間は通常攻撃が遠距離化して10%減速（0.5秒）。長押しで射程と向きを調整。Lv15では基礎270・減速20%。"],["S1｜堡塁（Bastion）","味方を指定すると駆け寄って6秒間防護。2人のHP比率に応じて合計基礎1000＋追加HP19%（2026-11-17強化後）のシールドを分配し、移動は味方が操作。タワーや廃墟を指定すると6秒間砲台化（対象指定不可）、本人とタワーを毎秒基礎125＋追加HP2.5%回復、タワーに基礎600＋追加HP12%のシールド。砲台化専用CDあり。"],["S2｜衝突進撃（Collision Course）","前進してヒーローを背後に投げる（約0.5秒）とともに周囲へ基礎300＋追加物理攻撃90%の物理ダメージ。落下時、周囲を0.5秒スタン。敵ヒーローとの衝突ダメージは対象HPの5%。S1防護中は敵を投げず押しのける挙動に変化。"],["ULT｜大盾防御（Allshield）","巨大な盾を叩きつけ、一時的なCC無効・ノックバック・1秒間の減速・基礎170＋追加物理攻撃55%の物理ダメージ。盾が前進して同等の追加ダメージと0.5秒打ち上げ、飛び道具も迎撃する。"]],"combo":"敵を投げたい場合はS2をS1防護前に使用。防護中のS1→通常攻撃長押し→S2は護衛・押し返し用途（投げにはならない）。タワー防衛はS1でタワー砲台化→必要なら再使用で解除。対突入はULTの射撃迎撃と移動制限を使う。非公式サイトの技能解釈を要約。","skillLevels":{"S1":[["CD（秒）",[10,9.6,9.2,8.8,8.4,8]],["味方合体 合計シールド基礎値",[1000,1200,1400,1600,1800,2000]],["砲台中 本人・タワー回復/秒 基礎値",[125,150,175,200,225,250]],["砲台化 専用CD（秒）",[15,14.4,13.8,13.2,12.6,12]],["タワーシールド基礎値",[600,720,840,960,1080,1200]]],"S2":[["CD（秒）",[10,9.6,9.2,8.8,8.4,8]],["基礎物理ダメージ sh","role":"Fighter","tags":["通常攻撃5スタック","拘束","ダメージ軽減","スプリットプッシュ","タイマン"],"plan":"Clashでミニオンを殴ってパッシブの5スタックを作り、接近した敵をS1で引き寄せて戦う。ULTは最初に当たる敵ヒーローを5秒間一定範囲に拘束。ソロではサイドレーンで優位を作り、敵が複数戻ったら退く。タワー攻撃は通常攻撃主体だが、無理に1対複数へ突入しない。","weak":"通常攻撃が届かない相手に弱く、ULTを外すと拘束・接近手段が不足する。スキル2の強化は2秒なのでタイミングを誤ると反撃される。11月5日の弱体化でパッシブとULTの火力が下がった。","source":"https://hub-game.com/hok/ja/heroes/laozi","skills":[["パッシブ｜先達の教え（Ancient Wisdom）","通常攻撃命中で訓戒を5秒間蓄積（最大5）。5スタックで5秒間強化され、移動速度+60（ヒーローLv15で+88）、攻撃速度+30%（Lv15で+58%）。強化通常攻撃に基礎65（Lv15で130）＋追加物理攻撃23%の確定ダメージ、S1とS2のCD各1秒短縮。2026-11-05調整後の数値。"],["S1｜聖人の訓戒（Corporal Punishment）","前方の敵を引き寄せ、基礎320（S1 Lv1）＋追加物理攻撃100%の物理ダメージ。1.5秒間25%減速（Lv6で持続2.5秒・50%減速）。CDはLv1で8秒→Lv6で7秒。"],["S2｜挙一明三（Intuition）","2秒間、移動速度+25%・被ダメージ45%軽減（Lv1）。最初に受ける通常攻撃のダメージの50%を反射して相手を2秒間15%減速。通常攻撃に25%の確率で50%ダメージの追加通常攻撃が発生。CD Lv1で7.5秒→Lv6で6秒。"],["ULT｜聖人の威（Sage's Might）","前方に突進し、最初に触れた敵ヒーローに基礎500＋追加物理攻撃185%の物理ダメージ。約5秒間明灯の範囲内へ拘束し、相手の与ダメージを20%減少させる。Lv3で基礎1000、CD Lv1で45秒→Lv3で35秒。2026-11-05弱体化後の数値。"]],"combo":"基本：ミニオンなどに通常攻撃を当て5スタック準備→S1で引き寄せ→通常攻撃を継続、敵の反撃に合わせてS2。確実なピック：側面からULTで拘束→S2で軽減し通常攻撃→逃げる相手をS1で引き戻す。HoK Hubのスキル相互作用に基づく非公式手順。","skillLevels":{"S1":[["CD（秒）",[8,7.8,7.6,7.4,7.2,7]],["基礎物理ダメージ",[320,384,448,512,576,640]],["減速持続時間（秒）",[1.5,1.7,1.9,2.1,2.3,2.5]],["減速（%）",[25,30,35,40,45,50]]],"S2":[["CD（秒）",[7.5,7.2,6.9,6.6,6.3,6]],["移動速度上昇（%）",[25,28,31,34,37,40]],["被ダメージ軽減（%）",[45,49,53,57,61,65]],["反射時の減速（%）",[15,18,21,24,27,30]]],"ULT":[["CD（秒）",[45,40,35]],["基礎物理ダメージ（11/05調整後）",[500,750,1000]]]},"numericNote":"S1/S2/ULTのレベル別基礎値・CD。追加物理攻撃や装備の係数、被弾状況は別計算。パッシブはヒーローLv1/15の基礎値のみ（確定ダメ65/130、移動速度60/88、攻撃速度30/58%）、中間Lvは未照合。11月5日パッチでパッシブ80–160→65–130・倍率28%→23%、ULT基礎600/900/1200→500/750/1000・倍率200%→185%を確認。ゲーム内最新実機の照合は未実施。","laneFit":{"Clash":"主要レーン（HoK Camp 2026-11-06統計）","Jungle":"未検証","Mid":"未検証","Farm":"未検証","Roam":"未検証"},"builds":[{"name":"対高HP前衛・通常攻撃主体（参考）","items":["スパークダガー","速攻の靴","フロストショック","魔女のマント","蒼天の剣","ドゥームズデイ"],"arcana":["宿命×10","狩猟×10","虚空×5","鷹の目×5"],"spell":"フラッシュ","recorded":"2026-08-28"},{"na iquipedia.net/honorofkings/Guiguzi","skills":[["パッシブ｜The Laws of Nature","敵の視界から外れると次の通常攻撃が強化され、追加ダメージと減速を与える。"],["S1｜Prophecy - Hidden Hand","移動速度が上がり、カモフラージュ状態で接近。触れた敵にダメージと物理・魔法防御低下を与える。"],["S2｜The Animist","時間差で周囲の敵を引き寄せてスタン。敵ヒーローに命中すると自分と近くの味方にシールド。"],["ULT｜Prophecy - Out of Sight","周囲の味方ごとカモフラージュし、移動速度を上げる。近い敵ヒーローの位置を確認できる。"]],"combo":"ULTで味方と接近→S1で敵に触れて防御低下→S2の時間差拘束を合わせ、味方の追撃へつなぐ。","verified":"効果をLiquipediaで照合（2026-11-14）。パッチ別のレベル数値は未検証。"},{"name":"Han Xin","id":53,"jp":"韓信","aliases":["かんしん","ハンシン","Han Xin"],"lane":"Jungle","role":"Assassin / Jungle","tags":["二段ジャンプ","逆方向ダッシュ","4回目の打ち上げ","高機動","サイドプッシュ"],"plan":"序盤はS1の壁越え2段ジャンプでガンクし、通常攻撃4回目の打ち上げを活用する。中盤以降はサイドウェーブを処理して、敵の位置が判明している時だけタワーに圧力をかける。敵の増援が来たらS1の2段目かS2の逆方向ダッシュで離脱。大型オブジェクトはスマイトの残りと敵位置を確認し、安全な人数差を作ってから取る。単独で常にタワーやボスを高速破壊できるとは断定しない。","weak":"素の耐久が低い。S1の2段とS2を攻撃に使い切ると撤退が難しい。S2は狙った方向と逆に動くので誤操作に注意。4回目の通常攻撃まで到達できない短い交戦、敵の連続CC、視界不明の敵ジャングル侵入に弱い。","source":"https://hub-game.com/hok/ja/heroes/han-xin","skills":[["パッシブ｜殺意の槍","通常攻撃の4回目に0.5秒の打ち上げと基礎90（ヒーローLv15では180）＋追加物理攻撃35%の物理ダメージ、物理ライフスティール20%。スキルまたは強化通常攻撃が命中すると攻撃速度25〜50%増加（ヒーローLv依存）。中間Lvは未検証。"],["S1｜無情な突撃","指定地点へジャンプし、周囲に基礎250＋追加物理攻撃85%の物理ダメージと0.5秒の打ち上げ。5秒以内にもう一度ジャンプ可能で、2段目にも同等のダメージ。壁越えに利用できる。"],["S2｜背水の陣","指定方向とは逆にダッシュし、3秒以内の次の通常攻撃を薙ぎ払いへ強化。薙ぎ払いに基礎120＋追加物理攻撃50%の物理ダメージ。薙ぎ払いが通常攻撃4回目に相当すればパッシブの打ち上げも発動。"],["ULT｜国士無双","前方扇形に槍を4回振り、各ヒットで基礎270＋追加物理攻撃85%の物理ダメージ。最終ヒットは0.5秒打ち上げ。発動中はCC無効と被ダメージ30%軽減。2026-11-17調整後の係数・基礎値で、個別スキル紹介ページの旧表記250＋65%を上書きして掲載。"]],"combo":"3回の通常攻撃→S2→強化通常攻撃（4回目として打ち上げ）→ULT。侵入と離脱：S1（1段目）→ULT→S1（2段目で撤退）。逃走：S1→S1→S2（S2は逆方向に動く点に注意）。いずれも外部攻略サイトの非公式提案であり、公式推奨コンボではない。","skillLevels":{"S1":[["CD（秒）",[7.5,7.2,6.9,6.6,6.3,6]],["基本物理ダメージ（1段ごと）",[250,300,350,400,450,500]]],"S2":[["CD（秒）",[6,5.8,5.6,5.4,5.2,5]],["強化通常攻撃の基礎物理ダメージ",[120,144,168,192,216,240]]],"ULT":[["CD（秒）",[30,27,24]],["1ヒットあたりの基礎物理ダメージ（11/17調整後）",[270,405,540]]]},"numericNote":"S1/S2/ULTのLv別CDは2026-11-19閲覧のHoK Hubのゲーム内転記値。ULT基礎ダメージと追加物理攻撃倍率は2026-11-17パッチの差分（250+125/Lv、65%→270+135/Lv、85%）を優先し、古いスキル本文を採用しない。1ヒットあたりのULT値。パッシブのヒーローLv2〜14は未確認、推算しない。装備のCD短縮前。国際版実機確認は未実施。","laneFit":{"Clash":"未検証","Jungle":"主要レーン（HoK Camp 2026-11-06）","Mid":"未検証","Farm":"未検証","Roam":"未検証"},"builds":[{"name":"参考1：継戦・ライフスティール","items":["Rapacious Bite","Boots of Fortitude","Axe of Torment","Master Sword","Overlord's Might","Bloodweeper"],"arcana":["Mutation×9","Red Moon×1","Reaver×9","Hunt×1","Eagle Eye×10"],"spell":"Smite（スマイト）","recorded":"2026-08-28"},{"name":"参考2：前衛の物理防御を貫通","items":["Rapacious Bite","Axe of Torment","Boots of Fortitude","Master Sword","Overlord's Might","Starbreaker"],"arcana":["Mutation×8","Red Moon×2","Reaver×7","Hunt×3","Eagle Eye×10"],"spell":"Smite（スマイト）","recorded":"2026-08-28"}],"matchups":{"unfavorable":["孔子（Fuzi）：拘束でジャンプ退避を阻止しやすい","貂蝉（Diaochan）：短い間隔の移動で追撃しにくい"],"synergy":["張良（Liang）：制圧でULTを当てやすくする","墨子（Mozi）：CCで着地先を固定しやすい"],"note":"HoK Hubによるスキル相互作用の定性的解説であり、公式の対面勝率ではない。強い対面側の体系的統計は未検証。"},"verified":"パッシブ・S1/S2/ULTの効果とレベル別CD/基礎数値をHoK Hubで資料照合（2026-11-19）。11/17のULT強化（1ヒット270/405/540、追加物攻85%）をパッチ履歴で上書き。HoK Camp統計は2026-11-06時点で調整前。参考ビルドは2026-08-28取得。最新実機・全5レーン適性・公式技動画・対面勝率は未検証。","sources":[["HoK Hub日本語：韓信の技能・装備・定性的相性","https://hub-game.com/hok/ja/heroes/han-xin","2026-11-19閲覧（ビルド2026-08-28）"],["HoK Hub英語：技能・各Lv CD・基礎値","https://hub-game.com/hok/en/heroes/han-xin","2026-11-19閲覧（HoK Camp統計2026-11-06）"],["HoK Hubパッチ一覧：2026-11-17 韓信ULT強化","https://hub-game.com/hok/en/patches","2026-11-19閲覧／2026-11-17適用"],["HoK公式：11/17サーバー更新告知（動的ページ、詳細本文未取得）","https://www.honorofkings.com/global-en/news-detail.html?content_id=4b6a7aa4a8b1ea4e09a9384a18521670f76f&father_content_id=4b6a7aa4a8b1ea4e09a9384a18521670f76f&sid=576","告知2026-11-16／本文は取得できず、数値の独立根拠には使用せず"]]},{"name":"Haya","id":54},{"name":"Heino","id":55,"jp":"ハイノ","lane":"Mid / Clash","role":"Mage / Fighter","tags":["遠近切替","継続回復","時間巻戻し","位置管理"],"plan":"遠距離で7秒間の印を維持し、S2で安全地点を記録してから近接戦へ。ULTの帰還先を失わないよう先に決める。","weak":"近接時の印維持とS1回復に依存。ULT発動中は動けず、帰還地点を読まれると危険。必中の拘束連携に注意。","source":"https://hub-game.com/hok/en/heroes/heino","officialHeroUrl":"https://world.honorofkings.com/zlkdatasys/ip/hero/en/563.html","skills":[["パッシブ｜Fate's Guidance","遠・近距離で通常攻撃の性質が変化。スキルと近距離通常攻撃が敵に7秒間の印を付ける。遠距離通常攻撃は物理攻撃100%+魔法攻撃15%、近距離は物理100%+魔法45%。"],["S1｜Scepter of Fate","遠距離：杖で魔法攻撃し、印のある敵へ追加の杖（基礎ダメージ75%）を飛ばす。近距離：範囲魔法攻撃・減速、命中で回復（最大3回）。印付き敵への命中1体ごとにCD0.2秒短縮、最大1秒。"],["S2｜Leap of Fate","ダッシュ終了位置の敵ヒーローの有無で形態が決まる。敵が近ければ近距離（回復・耐久強化）、いなければ遠距離（移動速度上昇）。遠距離への切替時に帰還用の記憶地点を残す。"],["ULT｜Fate Rewind","ダメージ軽減・妨害無効状態で1.5秒間動けなくなりHP回復。その後周囲に魔法ダメージを与え、記憶地点へ帰還。近くの味方タワーも過去の状態に戻す。回復量は低HP時に最大2倍。"]],"combo":"後方でS2を使って帰還地点を作る→S2で敵に接近して近接形態→印を付けてS1で回復→ULTで帰還。安全地点を準備せずに前進しない。","skillLevels":{"S1":[["CD（秒）",[5,4.8,4.6,4.4,4.2,4]],["遠距離 基礎魔法ダメージ",[410,494,578,662,746,830]],["近距離 基礎魔法ダメージ",[260,312,364,416,468,520]],["近距離 基礎回復",[150,180,210,240,270,300]],["減速（%）",[15,18,21,24,27,30]]],"S2":[["CD（秒）",[6,5.8,5.6,5.4,5.2,5]],["近距離 基礎回復",[450,540,630,720,810,900]],["防御上昇（資料の表記値）",[100,120,140,160,180,200]],["遠距離 移動速度上昇（%）",[15,18,21,24,27,30]]],"ULT":[["CD（秒）",[80,75,70]],["基礎魔法ダメージ",[400,600,800]],["基礎回復",[400,600,800]],["被ダメージ軽減（%）",[15,22.5,30]]]},"numericNote":"レベル別数値は基礎値（係数・装備補正・状況別の上限はスキル本文と参照資料を確認）。HoK Hubの2026-11-15閲覧内容に基づき、国際版実機での完全照合は未実施。","laneFit":{"Clash":"条件付き候補（近距離形態の維持を前提。採用率未照合）","Jungle":"未検証","Mid":"主要レーン（Camp掲載）","Farm":"未検証","Roam":"未検証"},"builds":[{"name":"耐性靴＋継戦ビルド","items":["Boots of Resistance","Holy Grail","Insatiable Tome","Twilight Stream","Augur's Word","Savant's Wrath"],"arcana":["Nightmare×10","Harmony×10","Void×10"],"spell":"Frenzy","recorded":"2026-08-28"}],"matchups":{"unfavorable":["Butterfly：近距離の通常攻撃が通りにくい","Zhang Fei：大きなシールドで削り切りにくい"],"synergy":["Dolia：ULTの再使用支援","Da Qiao：打ち上げに合わせて接近"],"note":"有利不利は外部攻略者の技能相互作用の解釈。対面別の統計的勝率とは異なる。"},"verified":"スキル概要・Lv別CD/基礎値をHoK Hubと照合（2026-11-15閲覧）。同サイトCamp統計の日付：2026-11-06。ビルド取得：2026-08-28。最新パッチでの実機確認は未実施。","sources":[["公式人物・スキン","https://world.honorofkings.com/zlkdatasys/ip/hero/en/563.html","2026-11-15閲覧"],["HoK Hubスキル・ビルド","https://hub-game.com/hok/en/heroes/heino","2026-11-15閲覧／Camp統計2026-11-06"]]},{"name":"Hou Yi","id":56},{"name":"Huang Zhong","id":57},{"name":"Jing","id":58},{"name":"Kaizer","id":59},{"name":"Kongming","id":60},{"name":"Kui","id":61,"jp":"鍾馗","lane":"Roam","role":"Support","tags":["フック","位置操作","ピック"],"plan":"茂み・射線・移動先を読んで敵を引き寄せ、人数差を作る。","weak":"外したあとの反撃と味方の位置に注意。","compare":"相手の配置ミスを突く読み合い系。","source":"https://liquipedia.net/honorofkings/Kui","skills":[["パッシブ｜Ethereal Outburst","大ダメージを受けたとき・倒されたあとに周囲へ魔法ダメージ。"],["S1｜Mortals!","周囲へ魔法攻撃と減速。内側の範囲はより強力。"],["S2｜Join Me","フックで敵を引き寄せて印を付与。撃破・アシストで最大HPも増加する。"],["ULT｜Into the Void","周囲に継続ダメージと減速。印の付いた敵にはスタンを与える。"]],"combo":"S2フック→印を付けた敵をS1で減速→ULTで拘束を延長。","verified":"効果をLiquipediaで照合（2026-11-14）。パッチ別のレベル数値は未検証。"},{"name":"Lady Sun","id":62,"jp":"孫尚香","aliases":["そんしょうこう","Lady Sun","孫尚香","Sun Shangxiang"],"lane":"Farm","role":"Marksman / Farm","tags":["通常攻撃でS1短縮","回避・射程強化","物防低下","ファーム後の攻城"],"plan":"Farmでミニオンを処理し、S2の刻印→通常攻撃でウェーブを押す。攻城時はミニオン到着と敵位置を確認して通常攻撃を継続し、S1の転がりを原則離脱用に温存。S1強化通常→射程延長通常で安全な距離から圧力をかける。タワー単独最速やボス単独討伐秒数は未実測で、スキルのヒーロー・ミニオン向け追加効果を建物へ適用できるとは断定しない。","weak":"機動力は主にS1頼みで、前転直後は離脱手段が乏しい。東皇太一の制圧や墨子のスタン、敵Jungleの位置不明時の前進を警戒。装備遅れで火力が伸びにくく、敵の複数CCに弱い。","compare":"ポケユナとの定量比較は未検証。通常攻撃で移動スキルのCDを短縮し、位置調整と射撃を繰り返す遠距離型。","source":"https://hub-game.com/hok/ja/heroes/sun-shangxiang","skills":[["パッシブ｜活力爆発","通常攻撃が命中するとS1のCDが10%短縮する。2026-10-21変更前の固定0.5秒減少から割合方式へ変更。ただし10%の計算対象（基準CDまたは残りCD）は資料に明記がなく未検証。"],["S1｜全力突撃","指定方向へ転がり、次の通常攻撃を強化して通過方向に基礎285〜570＋物理攻撃100%の物理ダメージ。強化通常攻撃の直後に射程の伸びた通常攻撃を続けられる。転がり後近くに敵ヒーローがいれば移速80%上昇（2秒で減衰）。2026-10-21調整後はスキルLvに応じCD5.0〜4.5秒。"],["S2｜紅蓮爆弾","指定地点を爆破して基礎380〜760＋追加物理攻撃120%の物理ダメージ、1秒の強い減速。物防を10%下げ、5秒間敵ヒーローとミニオンに刻印。刻印対象への通常攻撃に追加ダメージ：対ヒーロー基礎120〜240＋追加物攻36%、対ミニオンはスキルLv1で基礎240＋追加物攻72%。ミニオン向け基礎値のその他のLvは資料に直接の数値表がないため未検証。"],["ULT｜究極弩砲","前方に弩砲を放ち、最初の命中対象に基礎840/1260/1680＋追加物理攻撃250%の物理ダメージ。敵命中または最大射程で爆発し、着弾点の先の扇形範囲へ75%ダメージ。対建造物の適用可否は未検証。"]],"combo":"対人：S2刻印→S1→強化通常攻撃→ULT（資料の非公式コンボ）。攻城ではS1を逃走用に残し、ミニオンと敵位置を確認して通常攻撃を続ける。スキルの対建物倍率は未検証。","laneFit":{"Clash":"未検証","Jungle":"未検証","Mid":"未検証","Farm":"主要採用レーン（HoK Camp統計のFarm分類、2026-11-06）","Roam":"未検証"},"skillLevels":{"S1":[["CD（秒）",[5,4.9,4.8,4.7,4.6,4.5]],["強化通常・基礎物理ダメージ",[285,342,399,456,513,570]]],"S2":[["CD（秒）",[7.5,7.2,6.9,6.6,6.3,6]],["範囲攻撃・基礎物理ダメージ",[380,456,532,608,684,760]],["刻印対象・対ヒーロー追加基礎ダメージ",[120,144,168,192,216,240]]],"ULT":[["CD（秒）",[25,20,15]],["直撃・基礎物理ダメージ",[840,1260,1680]]]},"numericNote":"2026-11-22照合。HoK Hub日本語・英語のゲーム内転記値：S1物理攻撃100%、S2追加物攻120%（刻印追撃36%）、ULT追加物攻250%。S1の割合CD短縮は2026-10-21パッチ後だが割合計算対象は未確認。最新国際版実機で全技・全Lvを再測定していない。建物へのスキル適用・破壊秒数未確認。","builds":[{"name":"耐性・継戦（2026-08-28 Popular参考）","items":["抵抗の靴","シャドーアックス","エンドレスブレード","シャドーブレード","威光の弓","ブラッドエッジ"],"arcana":["禍源×10","略奪×8","狩猟×2","鷹の目×10"],"spell":"フラッシュ","recorded":"2026-08-28"},{"name":"対高HP前衛（2026-08-28 Popular参考）","items":["速攻の靴","シャドーアックス","マスターブレード","エンドレスブレード","威光の弓","ドゥームズデイ"],"arcana":["禍源×10","略奪×8","狩猟×2","鷹の目×10"],"spell":"フラッシュ","recorded":"2026-08-28"}],"matchups":{"unfavorable":["東皇太一（制圧）","墨子（接近時のスタン）"],"synergy":["廉頗（打ち上げ）","呂布（範囲CC）"],"note":"非公式HoK Hubの技構成からの定性分析。公式対面勝率ではない。相手が視界外の場合の単独攻城は安全と断定できない。"},"sources":[["孫尚香・日本語技名/数値/過去Popular（HoK Hub）","https://hub-game.com/hok/ja/heroes/sun-shangxiang","2026-11-22照合／技能はゲーム内転記、装備は2026-08-28取得"],["スキル原文/相性（HoK Hub英語）","https://hub-game.com/hok/en/heroes/sun-shangxiang","2026-11-22照合／定性相性はサイト独自解釈"],["2026-10-21調整（HoK Hub）","https://hub-game.com/hok/en/patches/2026-10-21","2026-11-22照合／パッシブとS1 CD変更"],["2026-11-17パッチ変更対象（HoK Hub）","https://hub-game.com/hok/en/patches","2026-11-22照合／孫尚香は対象9体に含まれない"]],"verified":"2026-11-22：パッシブ・S1/S2/ULTとLv別CD/基礎値、日本語技能名、過去Popularの2構成・対策を外部資料で照合。2026-10-21調整を反映。最新実機・建物への倍率・公式個別技動画・全5レーン採用統計・対面勝率は未検証。"},{"name":"Lady Zhen","id":63},{"name":"Lam","id":64},{"name":"Lapulapu","id":65},{"name":"Li Bai","id":66},{"name":"Li Xin","id":67,"jp":"李信","aliases":["りしん","リシン","リ・シン","Li Xin"],"lane":"Clash","role":"Fighter","tags":["光と闇の形態切替","闇形態の攻撃速度","サイドレーン圧力","移動・減速解除","形態エネルギー"],"plan":"Clashで基本形態の通常攻撃とS2を敵ヒーローへ当てて経験値を獲得する。覚醒後は機動力と攻撃回数を活かした闇（Revenge）形態でサイドのミニオンを押し、敵の姿がほかのレーンに見えている時だけタワーに圧力をかける。攻撃速度の上昇は2026-08-27調整以降は長時間維持ではなく2秒で減衰するため、無制限の高速攻城を保証しない。相手が複数戻ればS1を退路に使って撤退。大型ボスの単独討伐速度やタワー破壊秒数は未計測。","weak":"フォーム切替後のエネルギーは時間経過で減少し、強化効果が薄れる。エネルギーが多い時の再切替は次形態の初期エネルギーが少ない。序盤は追加物攻が低くS2のダメージが伸びにくい。形態ごとの技挙動と操作の習熟が必要。遠距離牽制・複数人の包囲に注意。","source":"https://hub-game.com/hok/en/heroes/li-xin","skills":[["パッシブ｜灰刃（Ashen Razor）","基本形態の通常攻撃・S2が敵ヒーローに命中すると経験値10獲得。光形態は追加攻撃速度1%につき物理被ダメ軽減0.15%、闇形態は追加物理攻撃1.5につき攻撃速度0.1%。両形態ともエネルギー量で効果が50〜100%増加。基本→覚醒でエネルギー100、維持中毎秒10減少。光/闇間で切替時は新形態エネルギーが100−旧エネルギーとなる。"],["基本形態S1｜Lightning Dash","指定方向へのダッシュ。Lv1 CD6.5秒、Lv6 CD5秒。ダメージ効果は出典の基本形態技能説明に記載なし。"],["基本形態S2｜Chaos Wave","指定方向へ剣気を放ち、基礎物理450（Lv6=900）＋追加物理攻撃135%のダメージ、2秒間の減速（Lv1=25%、Lv6=50%）。CD Lv1=5秒→Lv6=4秒。"],["基本形態：光覚醒（Light Awakening）","CD30秒。光（Domination）形態へ変身しエネルギーを最大値100にする。維持中毎秒10減少。基本形態ページではSkill 3に表記。"],["基本形態：闇覚醒（Dark Awakening）","CD30秒。闇（Revenge）形態へ変身しエネルギーを最大値100にする。維持中毎秒10減少。基本形態ページではUltimateに表記。"],["光形態｜Righteous Charge / Blade Flurry / Searing Edge","Righteous ChargeとSearing Edgeはチャージ中CC無効を持ち、被ダメージ軽減も得る。Blade Flurryは命中時回復を持つ。Searing Edgeの基礎ダメージは2026-08-27にLv1=250（Lvごと+125）・追加物攻85%へ減少。光形態全技の完全なレベル別表は未照合。"],["闇形態｜Righteous Fervor / Brutal Gouge / Shadow Seal","Righteous Fervorはチャージ中に減速解除・回復・移動速度上昇。2026-08-27調整で1秒チャージの攻撃速度上昇は45〜90%、2秒で減衰。Brutal Gougeは減速と通常攻撃への追加効果があり、CDはLv1で7.5秒（Lvごと0.3秒短縮）。Shadow Sealは設置後時間差で爆発する。闇形態全技の個別Lv数値とスキル枠対応は未照合。"],["形態間切替｜Force Break / Force Mastery","光・闇間の切替技。出典によればCDなし、CCで中断されず、周囲へダメージを与える。切替後のエネルギーはパッシブ規則による。全数値未照合。"]],"combo":"基本形態：S2でウェーブと敵を牽制しS1は逃走用に温存。闇形態：Shadow Sealを先置き→Brutal Gougeで減速→通常攻撃で追撃。光形態：スキルと強化通常攻撃を交互に当てCDを短縮。いずれもHoK Hubの非公式解説を要約。サイド攻城は敵の位置を確認し、ミニオンがいる時だけ前進する。","skillLevels":{"基本形態S1":[["CD（秒）",[6.5,6.2,5.9,5.6,5.3,5]]],"基本形態S2":[["CD（秒）",[5,4.8,4.6,4.4,4.2,4]],["基礎物理ダメージ",[450,540,630,720,810,900]],["減速（%）",[25,30,35,40,45,50]]]},"numericNote":"表は基本形態のS1/S2だけ。光と闇には別スキルがあるが、個別の全Lv値・CDを確認できていないため省略。2026-08-27パッチの闇S1攻撃速度増加45〜90%（2秒で減衰）、闇S2 CD 7.5秒（Lvごと−0.3秒）、光Searing Edge基礎250（Lvごと+125）＋追加物攻85%はパッチ資料による確認値であり、最新実機とは未照合。公式の実機数値・建物破壊秒数は未測定。","laneFit":{"Clash":"主要レーン（HoK Camp 2026-11-06）","Jungle":"未検証","Mid":"未検証","Farm":"未検証","Roam":"未検証"},"builds":[{"name":"参考：攻撃速度・会心・吸血","items":["Boots of Tranquility","Sparkforged Dagger","Doomsday","Shadow Ripper","Eternity Blade","Bloodweeper"],"arcana":["Fate×10","Hunt×10","Eagle Eye×10"],"spell":"ピュリファイ（Purify）","recorded":"2026-08-28"},{"name":"参考：物理耐久・HP","items":["Boots of Fortitude","Sparkforged Dagger","Doomsday","Blood Rage","Shadow Ripper","Ominous Premonition"],"arcana":["Fate×10","Hunt×10","Eagle Eye×10"],"spell":"テレポート（Teleport）","recorded":"2026-08-28"}],"matchups":{"unfavorable":["張飛：接近後の押し戻しとシールドで交戦時間を制限される","アレン：長期戦で軽減と回復を重ねられる"],"synergy":["鬼谷子：集敵に範囲技を合わせやすい","蔡文姫：スタン・回復が近接戦を支援"],"note":"HoK Hub掲載のスキル相互作用による定性的見解。公式の対面別勝率やソロ攻城能力ランキングではない。"},"verified":"基本形態のパッシブ・S1/S2・2種覚醒と、光/闇形態の主要効果をHoK Hub英語版で資料照合（2026-11-20）。基本形態S1/S2のLv別数値のみ表化。光/闇の全技・全Lv数値・CD、公式個別動画、全5レーン、国際版実機は未検証。6/17の形態改修と8/27の調整を参照。ビルドは2026-08-28の参考、Camp統計は2026-11-06。","sources":[["HoK Hub英語：李信の技能・形態・ビルド・相性","https://hub-game.com/hok/en/heroes/li-xin","2026-11-20閲覧／Camp 2026-11-06・ビルド2026-08-28"],["HoK Hub：2026-08-27 李信の光・闇形態調整","https://hub-game.com/hok/en/patches/2026-08-27","2026-11-20閲覧／8-27適用"],["HoK Hub：2026-06-17 李信のフォーム改修","https://hub-game.com/hok/en/patches/2026-06-17","2026-11-20閲覧／6-17適用"]]},{"name":"Lian Po","id":68,"jp":"廉頗","lane":"Clash / Roam候補","role":"Tank","tags":["打ち上げ","突入","集団CC"],"plan":"敵の逃走経路を見て突入し、複数の妨害をつなぐ。","weak":"味方の追撃範囲外でCCを使い切らない。","compare":"マンムーの突入・連続妨害に近い。","source":"https://liquipedia.net/honorofkings/Lian_Po","skills":[["パッシブ｜Warrior's Soul","スキル中はCC無効。戦闘中に闘志をためて被ダメージ軽減などを得る。"],["S1｜Burst Ram","突進して敵を打ち上げる。"],["S2｜Magma Slam","シールドと周囲への減速・範囲ダメージ。敵を巻き込むとS1のCDをリセット。"],["ULT｜Tremor Smash","3回の衝撃波で減速し、最終段で打ち上げる。"]],"combo":"S1打ち上げ→S2でS1の再使用を狙う→再度S1→ULT最終段を集団に当てる。","verified":"効果をLiquipediaで照合（2026-11-14）。パッチ別のレベル数値は未検証。"},{"name":"Liang","id":69},{"name":"Liu Bang","id":70},{"name":"Liu Bei","id":71},{"name":"Liu Shan","id":72,"jp":"劉禅","lane":"Roam","role":"Support / Tank","tags":["建物にスキルダメージ","タワー機能妨害","建物攻撃で回復","打ち上げとスタン","シールド","近距離攻城"],"plan":"Roamで味方射手の安全を確保し、敵を下がらせた直後にタワーへ近づく。パッシブでスキルが建物にも当たり、CC技で建物を1.2秒妨害できる。S1で接近→強化通常攻撃の打ち上げ→S2の1秒スタンで敵を拘束。建物へ技を命中させるとHP回復。タワーを単独で削れる技能を持つが、ローム装備で単独最速破壊できるという意味ではない。敵位置不明で無理に敵タワーへ入らない。","weak":"技が近距離中心で長射程・移動技持ちに触りにくい。主な接近手段はS1の加速。ロームは装備資金に制約があり、単独で敵を倒す火力・大型オブジェクトの討伐速度は限定的。タワーの攻撃停止1.2秒が切れる前に離脱・防御判断。","source":"https://hub-game.com/hok/en/heroes/liu-shan","skills":[["パッシブ｜磁力バリア（Magnetic Barrier）","スキルは建物へもダメージを与え、CCを伴うスキルは建物の動作を1.2秒妨害する。建物にスキルダメージを与えるとHPを回復（ヒーローLv1時280、Lv15時672）。中間ヒーローLvの回復値は未照合。"],["S1｜オーバーチャージ！（Overcharge!）","3秒間のシールド（基礎650＋追加HP16%、S1 Lv1）と、時間経過で減衰する移動速度50%上昇。次の通常攻撃が範囲叩きつけに変わり、基礎物理350＋物理攻撃122%のダメージと1秒打ち上げ。Lv1 CD9秒。"],["S2｜ロボスマッシュ（Robo Smash）","前方扇形に基礎物理400＋物理攻撃100%のダメージを与え、1秒スタン。建物にもパッシブのダメージ・妨害が作用する。Lv1 CD7.5秒。"],["ULT｜グルグルスピン（Take It for a Spin）","3秒間回転し、0.5秒ごとに周囲へ基礎物理380（ULT Lv1）＋追加物理攻撃110%のダメージ。1秒ごとに0.5秒間の15%減速（ULT Lv1）。回転中もS1・S2を使用可能。Lv1 CD40秒。"]],"combo":"攻城：敵を下がらせる→S1で接近し建物へ強化攻撃→S2で建物を1.2秒妨害→ULTで攻撃（再度のS2はCD終了後）。対人拘束：S1加速→強化通常攻撃の打ち上げ1秒→S2スタン1秒→ULTの範囲減速。HoK Hubの技説明に基づく非公式手順。","verified":"パッシブ・S1/S2/ULTと各スキルLv別のCD・基礎値をHoK Hub英語版で資料照合（2026-11-20）。2026-11-06のCamp統計および2026-08-28取得参考ビルドは現在値ではない。現行国際版ゲーム内・公式個別スキル動画・全レーン実績は未確認。","aliases":["りゅうぜん","リュウゼン","劉禪","Liu Shan"],"skillLevels":{"S1":[["CD（秒）",[9,8.6,8.2,7.8,7.4,7]],["強化通常攻撃の基礎物理ダメージ",[350,400,450,500,550,600]],["移動速度上昇・開始時（%）",[50,60,70,80,90,100]],["シールド基礎値",[650,780,910,1040,1170,1300]]],"S2":[["CD（秒）",[7.5,7.2,6.9,6.6,6.3,6]],["基礎物理ダメージ",[400,480,560,640,720,800]]],"ULT":[["CD（秒）",[40,35,30]],["0.5秒ごとの基礎物理ダメージ",[380,570,760]],["減速（%）",[15,22.5,30]]]},"numericNote":"レベル別数値はHoK Hub英語版2026-11-20閲覧のゲーム内転記。S1は物攻122%・追加HP16%、S2は物攻100%、ULTは追加物攻110%を各Lvの基礎値に加える。パッシブの回復はヒーローLv1=280、Lv15=672のみ確認。全レベルの数値、スキルの建物への実ダメージ・最新実機・最新パッチ適合は未検証。","laneFit":{"Clash":"未検証","Jungle":"未検証","Mid":"未検証","Farm":"未検証","Roam":"主要レーン（HoK Camp 2026-11-06統計）"}," スキルLv別のCD変動は資料に記載なし）。S2を攻めに使うと移動による離脱手段が減る。"],["ULT｜フレンジー・バラージ","指定方向へ瞬間移動後、3秒間周囲を乱射。各ヒット基礎170/235/300＋物理攻撃25%の物理ダメージ。スキルLvで弾数12/15/18、CD50/45/40秒。発射速度は攻撃速度依存。乱射3回を通常攻撃1回とみなす。乱射中は移動速度が落ちる。"]],"combo":"対ヒーロー：S1と通常攻撃で10スタックを溜め、防御破壊を付けてからULT（非公式の提案）。逃走：S2で距離を取ってS1で反撃。タワーを折る場合は敵位置を確認してミニオンと通常攻撃を優先。パッシブが建造物へ発動するとの根拠はない。","laneFit":{"Clash":"未検証","Jungle":"未検証","Mid":"未検証","Farm":"主要採用レーン（HoK Camp統計のFarm分類、2026-11-06）","Roam":"未検証"},"skillLevels":{"S1":[["基礎物理ダメージ／弾",[120,144,168,192,216,240]],["消費エネルギー",[75,69,63,57,51,45]],["弾丸数",[5,6,7,8,9,10]]],"S2":[["消費エネルギー",[75,69,63,57,51,45]],["敵ヒーロー近接時の移動速度上昇（%）",[15,18,21,24,27,30]]],"ULT":[["CD（秒）",[50,45,40]],["消費エネルギー",[75,60,45]],["基礎物理ダメージ／ヒット",[170,235,300]],["乱射弾数",[12,15,18]]]},"numericNote":"2026-11-22 HoK Hub日本語・英語でスキル値を資料照合。S1とS2の表示CDは5秒だがLv別CD表の記載がないためレベルごとの値を推算せず本文にのみ記載。パッシブ確定ダメージ基礎はヒーローLv1=100、Lv15=200の端点のみ確認。最新国際版実機および大型ボス討伐秒数・対タワー倍率は未検証。","builds":[{"name":"連射・耐久（2026-08-28 Popular参考）","items":["速攻の靴","スパークダガー","ドゥームズデイ","フロストショック","威光の弓","魔女のマント"],"arcana":["紅月×10","狩猟×10","鷹の目×10"],"spell":"スタン","recorded":"2026-08-28"}],"matchups":{"unfavorable":["虞美人（物理攻撃無効）","張飛（ノックバック）"],"synergy":["瑶（憑依シールド）"],"note":"非公式HoK Hubが各スキルに基づいて挙げた定性相性。公式対面勝率は未照合。"},"sources":[["マルコ・ポーロ日本語技名/数値/過去Popular（HoK Hub）","https://hub-game.com/hok/ja/heroes/marco-polo","2026-11-22照合／技能はゲーム内転記、装備は2026-08-28取得"],["英語原文/相性（HoK Hub）","https://hub-game.com/hok/en/heroes/marco-polo","2026-11-22照合／定性相性はサイト独自解釈"],["2026-11-17パッチ変更対象（HoK Hub）","https://hub-game.com/hok/en/patches","2026-11-22照合／マルコ・ポーロは対象9体に含まれない"]],"verified":"2026-11-22：パッシブ・S1/S2/ULTとLv別の基本値/エネルギー/ULT CD、日本語名、過去Popular構成、定性対策を外部資料で照合。S1/S2のLv別CD、公式個別動画、最新国際版実機、対タワー倍率・ボス討伐速度、全レーン・対面統計は未検証。"},{"name":"Mayene","id":80},{"name":"Meng Ya","id":81},{"name":"Menki","id":82},{"name":"Mi Yue","id":83},{"name":"Milady","id":84,"jp":"ミレディ","lane":"Mid","role":"Mage","tags":["ロボット召喚","タワー直接攻撃","攻城","ウェーブ押し","逃走手段なし"],"plan":"S2でロボットを召喚してウェーブを押し、敵が別レーンに見えた時にタワーへULTで刻印を付けて攻城。ロボットがタワー攻撃を受ける間に削る。移動スキルがないため敵ジャングラー不明時は前進しない。","weak":"自力の移動技がなく奇襲に弱い。ロボットを範囲技で掃除する敵に弱い。S2の全ストックを攻城で使い切ると迎撃に使えない。","source":"https://hub-game.com/hok/ja/heroes/milady","skills":[["パッシブ｜ロボット（Mechanical Minions）","敵を撃破すると6秒間戦うロボットを召喚。生存した同Lvロボットは合体して最大Lv3、合体できなければ自爆し魔法ダメージ。Lv1ロボット通常攻撃は基礎120＋魔法攻撃25%、HPは基礎500＋魔法攻撃110%。ロボットが建物へ与えるダメージは75%。自爆基礎200＋魔法攻撃30%（ヒーローLv15で基礎410）。"],["S1｜戦闘機爆撃（Air Superiority）","戦闘機を発進させ、付近の敵へ複数回の魔法攻撃（Lv1基礎65＋魔法攻撃10%、2回ごとに追加基礎140＋魔法攻撃20%）。飛行中の再発動で2機に分離し、両方に攻撃された敵を1.5秒間減速（Lv1で25%）。CDはLv1で8秒、消費MP50。"],["S2｜強制進撃（Forced Invasion）","指定地点にロボット2体を投下。着地時に基礎100＋魔法攻撃20%の魔法ダメージ、1秒後に攻撃開始。スキル発動CDは3秒、最大3ストック、ストック補充間隔はスキルLv1で15秒→Lv6で12秒（CD短縮の影響あり）。消費MP25。"],["ULT｜磁場の刻印（Chaos Field）","敵またはタワー/クリスタルに3秒間の刻印を付与。非建造物の対象は0.75秒スタン。0.5秒ごとに基礎80＋魔法攻撃4%の魔法ダメージと15%減速。終了時に刻印中の対象への累積ダメージ25%（ULT Lv1）分で爆発。ロボットの攻撃速度・移動速度を100%増加し対象へ集中攻撃。建造物はスタンしない。ULT Lv1 CD30秒、消費MP100。"]],"combo":"攻城：S2でロボットを設置→ULTをタワーに付ける→S1で周囲を処理。自衛：接近した敵へULTの短時間スタン→S2でロボットを補充→S1を再発動して減速し、距離を取る。サイト独自の技効果に基づく手順で公式推奨ではない。","skillLevels":{"S1":[["CD（秒）",[8,7.6,7.2,6.8,6.4,6]],["通常攻撃 基礎魔法ダメージ",[65,78,91,104,117,130]],["分裂機 基礎魔法ダメージ",[65,78,91,104,117,130]],["追加打撃 基礎魔法ダメージ",[140,168,196,224,252,280]],["両機命中時 減速（%）",[25,30,35,40,45,50]]],"S2":[["発動CD（秒）",[3,3,3,3,3,3]],["ストック補充間隔（秒）",[15,14.4,13.8,13.2,12.6,12]],["投下時 基礎魔法ダメージ",[100,120,140,160,180,200]]],"ULT":[["CD（秒）",[30,27,24]],["0.5秒ごとの 基礎魔法ダメージ",[80,120,160]],["終了時爆発：刻印中の累積被ダメージ比（%）",[25,37.5,50]]]},"numericNote":"スキルLv別の基礎値。魔法攻撃の係数、装備/アルカナ補正は各技本文も参照。S2は発動間隔とストック回復間隔が別。パッシブの自爆基礎値はヒーローLv1=200、Lv15=410だが中間14段階は未照合。HoK Hubのゲーム内説明書き起こしを2026-11-17閲覧。国際版実機と11月17日以降の調整完全一致は未検証。","laneFit":{"Clash":"未検証","Jungle":"未検証","Mid":"主要レーン（HoK Camp 2026-11-06）","Farm":"未検証","Roam":"未検証"},"builds":[{"name":"早期レーン押し・範囲攻撃（参考）","items":["静謐の靴","残響の杖","フローズンブレス","トワイライトストーム","賢者の怒り","苦痛のマスク"],"arcana":["夢魔×10","狩猟×10","生贄×7","心眼×3"],"spell":"ピュリファイ","recorded":"2026-08-28"},{"name":"高HPへの割合ダメージ（参考）","items":["静謐の靴","苦痛のマスク","フローズンブレス","トワイライトストーム","賢者の怒り","夢魔の牙"],"arcana":["夢魔×10","狩猟×10","心眼×10"],"spell":"フラッシュ","recorded":"2026-08-28"}],"matchups":{"unfavorable":["不知火舞：機動力で接近されやすく、自衛が難しい","太公望：範囲攻撃でロボットをまとめて処理されやすい"],"synergy":["孫臏：加速と減速で攻城位置を維持しやすい","張飛：シールド・ノックバックで本体を守りやすい"],"note":"非公式HoK Hubのスキル相互作用による定性的な考察。対面勝率に基づく順位ではない。"},"verified":"パッシブ・S1/S2/ULTの効果とLv別基礎値/CDをHoK Hub日本語・英語のゲーム内書き起こしで資料照合（2026-11-17）。HoK Camp統計2026-11-06、ビルド取得2026-08-28。5レーン採用率、最新パッチでの実機、パッシブ全Lv、公式スキル動画は未検証。","sources":[["HoK Hub日本語：ミレディ スキル/レベル別数値/対面/装備","https://hub-game.com/hok/ja/heroes/milady","2026-11-17閲覧／Camp 2026-11-06・装備2026-08-28"],["HoK Hub英語：同技能データ照合","https://hub-game.com/hok/en/heroes/milady","2026-11-17閲覧"],["HoK Hubパッチ一覧：11月5日調整の確認","https://hub-game.com/hok/en/patches","2026-11-17閲覧／最新実機再照合なし"]]},{"name":"Ming","id":85},{"name":"Mozi","id":86},{"name":"Mulan","id":87},{"name":"Musashi","id":88},{"name":"Nakoruru","id":89},{"name":"Nezha","id":90},{"name":"Nuwa","id":91},{"name":"Pei","id":92},{"name":"Sakeer","id":93},{"name":"Shangguan","id":94},{"name":"Shi","id":95},{"name":"Shouyue","id":96},{"name":"Sima Yi","id":97},{"name":"Sun Bin","id":98},{"name":"Sun Ce","id":99,"jp":"孫策","aliases":["そんさく","Sun Ce"],"lane":"Clash","role":"Fighter / Tank","tags":["船で長距離ローム","ノックアップ","対物理の継戦","サイドのプッシュ"],"plan":"Clashで先にウェーブを処理して川・MIDへの移動時間を作る。ULTの船は壁・タワー・古代モンスター・敵ヒーローに衝突すると爆発するため、地形と敵位置を見て航路を決める。タワーはミニオンが届いた時だけ安全に攻撃し、単独でボスや建造物を最速処理できるとは扱わない。敵がサイドへ寄る間に離脱する判断も大切。","weak":"魔法ダメージには不屈の物理防御増加が効かない。船は壁や建造物で途中停止し、荘子などのCC解除にノックアップを消される。突撃後の射程外からの攻撃にも注意。対面に拘束無効があるときは船の当て方を変える。","compare":"ポケユナの特定キャラと完全一致する操作感は未検証。船の進入経路と敵集団への連続ノックアップで集団戦の起点を作るタイプ。","source":"https://hub-game.com/hok/ja/heroes/sun-ce","skills":[["パッシブ｜荒れ狂う潮","5秒ごとに強化通常攻撃。追加基礎110（ヒーローLv15で250）＋物理攻撃60%の物理ダメージ、基礎55（Lv15で125）＋物理攻撃30%＋失ったHP3%を回復。物理/確定ダメージを受けるかスキルを命中させると不屈1スタック。最大10、各6秒間物理防御を16〜32上げる（ヒーローLv依存）。中間レベルは未転記。"],["S1｜波風裂斬","指定方向へ突進してルート上に基礎140〜280＋物理攻撃55%の物理ダメージ。終点の範囲に基礎280〜560＋物理攻撃110%、その後同じ基礎値と倍率の追撃で1秒間ノックアップ。10/21改定後の数値を採用。"],["S2｜大津波","前方の敵を斬り、基礎200〜400＋物理攻撃90%の物理ダメージ。3回まで再発動でき、連続ヒットで各回の威力が25%増加。減速を各回付与し2秒持続・最大3スタック。発動のたび通常攻撃の待機時間をリセット。"],["ULT｜いざ出航！","最大12秒間船に乗り、操船中はCC無効。船はミニオン・非古代モンスターを押しのけ、古代モンスターや壁、建造物、敵ヒーローに衝突すると爆発し範囲物理ダメージ（基礎350/525/700＋物理攻撃120%）、1〜1.5秒間ノックアップ。再発動で降船可能。命中で不屈5スタック。近くの味方1人が乗船できる。"]],"combo":"船で開戦：ULT→衝突で浮かせる→S1で再度浮かせる→S2→通常攻撃→S2→通常攻撃→S2。レーン戦：S1→S2→通常攻撃→S2→通常攻撃→S2。HoK Hubの非公式コンボをもとにした参考で、公式推奨や実機検証済みの連携ではない。","laneFit":{"Clash":"主要採用レーン（非公式DB・ゲーム内HoK Camp分類）。攻守と移動支援が得意","Jungle":"未検証","Mid":"未検証","Farm":"未検証","Roam":"船での味方同行は可能だがローム適性の統計は未検証"},"skillLevels":{"S1":[["CD（秒）",[8,7.8,7.6,7.4,7.2,7]],["突進の基礎物理ダメージ",[140,168,196,224,252,280]],["終点・追撃それぞれの基礎物理ダメージ",[280,336,392,448,504,560]]],"S2":[["CD（秒）",[9,8.4,7.8,7.2,6.6,6]],["初回基礎物理ダメージ",[200,240,280,320,360,400]],["1スタックの減速（%）",[15,18,21,24,27,30]]],"ULT":[["CD（秒）",[40,35,30]],["船衝突の基礎物理ダメージ",[350,525,700]]]},"numericNote":"参照：2026-11-21閲覧のHoK Hub英語/日本語。S1/S2は2026-10-21調整後の基礎数値。S1は物攻55%（突進）/110%（範囲）、S2は物攻90%、ULTは物攻120%。パッシブはヒーローLv1/15の端点のみで中間は未照合。数値は外部のゲーム内転記で、最新国際版の実機確認ではない。","builds":[{"name":"攻撃・減速（過去のPopularセット）","items":["抵抗の靴","シャドーアックス","蒼天の剣","氷霜のグリップ","魔女のマント","砕星の槌"],"arcana":["変異×10","隠匿×10","鷹の目×10"],"spell":"スタン","recorded":"2026-08-28"},{"name":"耐久重視（過去のPopularセット）","items":["忍びの靴","シャドーアックス","フロストショック","魔女のマント","スパイクアーマー","紅蓮のマント"],"arcana":["変異×10","隠匿×10","鷹の目×10"],"spell":"ターミネート","recorded":"2026-08-28"}],"matchups":{"unfavorable":["荘子（拘束解除）","Ata（ノックアップ耐性）"],"synergy":["鬼谷子（集敵）","Dolia（ULT再使用支援）"],"note":"HoK Hubによる技能相性の定性的分析。公式対面別勝率は未照合。敵の操作・構成で評価は変わる。"},"sources":[["スキル・CD・コンボ（HoK Hub日本語）","https://hub-game.com/hok/ja/heroes/sun-ce","2026-11-21閲覧／非公式・ゲーム内転記"],["10/21調整後数値（HoK Hub英語）","https://hub-game.com/hok/en/heroes/sun-ce","2026-11-21閲覧／2026-10-21パッチ"],["11/17パッチ変更対象一覧","https://hub-game.com/hok/en/patches","2026-11-21閲覧／孫策は当該9体に含まれない"]],"verified":"2026-11-21：非公式DBでパッシブ・S1/S2/ULT、各技Lv別基礎値とCD、装備・コンボを照合。公式実機、最新装備、個別動画、全5レーンの統計、公式対面勝率は未検証。"},{"name":"Ukyo Tachibana","id":100},{"name":"Umbrosa","id":101},{"name":"Wang Wei","id":102,"jp":"王維","aliases":["おうい"]},{"name" e×8","Compassion×2"],"spell":"Flash","recorded":"2026-08-28"}],"matchups":{"unfavorable":["Han Xin：CC無効で打ち上げを回避しやすい","Diaochan：移動技で盤ができる前に離脱しやすい"],"synergy":["Liu Shan：スタンから盤完成までの時間を稼ぐ","Nakoruru：盤内の敵への突入火力"],"note":"有利不利は外部攻略記事の技能相互作用に基づく意見。対面別勝率を実測したものではない。"},"verified":"スキル概要・Lv別CD/基礎値をHoK Hubと照合（2026-11-15閲覧）。同サイトCamp統計の日付：2026-11-06。ビルド取得：2026-08-28。実機およびパッシブ全Lvは未照合。","sources":[["公式人物・スキン","https://world.honorofkings.com/zlkdatasys/ip/hero/en/197.html","2026-11-15閲覧"],["HoK Hubスキル・ビルド","https://hub-game.com/hok/en/heroes/yi-xing","2026-11-15閲覧／Camp統計2026-11-06"]],"aliases":["棋星","きせい","弈星"]},{"name":"Yuhuan","id":115},{"name":"Zhang Fei","id":116},{"name":"Zhou Yu","id":117,"jp":"周瑜","lane":"Mid","role":"Mage","tags":["燃焼エリア","陣地制圧","ノックバック","範囲スタン","自己回復"],"plan":"S2で炎の地帯を先に設置し、S1の風で敵の進路へ広げる。オブジェクト前の通路を占有し、炎の上を通るULTで範囲スタンを狙う。炎の中に立つと自身を回復できる。","weak":"単独で移動するスキルを持たず、設置前に接近されると不利。ULTのスタンは炎を通すことが条件。敵が迂回できる開けた場所では炎を重ねすぎない。韓信の妨害耐性や墨子のシールドには注意。","source":"https://hub-game.com/hok/ja/heroes/zhou-yu","officialHeroUrl":"https://world.honorofkings.com/zlkdatasys/ip/hero/m/en/124.html","skills":[["パッシブ｜引火（Blaze）","通常攻撃・スキルで4秒持続する印を付け、4スタックで4秒間燃焼。1秒ごとに基礎125（ヒーローLv1）＋魔法攻撃17%の魔法ダメージ。1秒間15%減速。燃焼中の相手に印は追加されない。タワーにも印が付く。"],["S1｜強大な東風（Wildfire）","3秒間の風域を展開し、味方を加速（自身への効果は2倍）、敵を減速。発動時に指定方向へノックバックし、基礎200＋魔法攻撃30%の魔法ダメージ。風が炎の地帯を1秒以上覆うと炎が伸び、追加の炎は0.5秒ごとに基礎100＋魔法攻撃25%の魔法ダメージ。"],["S2｜流火の矢（Scorching Bolt）","火矢着弾時に基礎250＋魔法攻撃40%の魔法ダメージ。6.5秒間の炎地帯を設置し、0.5秒ごとに基礎100＋魔法攻撃30%の魔法ダメージ。炎地帯は最大6か所、火矢は最大3ストック。発動間隔0.6秒（ストック補充Lv1で9秒）。本人が炎の上にいると0.5秒ごとに基礎35＋魔法攻撃7%＋追加HP2%を回復。"],["ULT｜赤壁の狼煙（Flames of War）","扇形の炎で基礎200＋魔法攻撃40%の魔法ダメージ。既存の炎地帯を通過した場合は熱風を発生させ、さらに基礎200＋魔法攻撃40%の魔法ダメージと1秒間のスタン。炎がない場合はスタンしない。"]],"combo":"基本：S2→S2→S1→ULT。炎を先に置き風で延焼させてから、炎の上を通るULTでスタンを発動。対面では4秒以内に通常攻撃・技で印を重ねて引火を狙う。コンボは資料サイトの考察であり公式推奨ではない。","skillLevels":{"S1":[["CD（秒）",[5,4.8,4.6,4.4,4.2,4]],["ノックバック 基礎魔法ダメージ",[200,240,280,320,360,400]],["延焼 基礎魔法ダメージ/0.5秒",[100,120,140,160,180,200]],["味方の移動速度上昇（%）",[5,6,7,8,9,10]],["敵の移動速度低下（%）",[10, <script>

const title=h=>h.jp?h.jp+' / '+h.name:h.name;
function home(){
 const q=window._q||'',lane=window._lane||'all',only=window._only||false;

 document.getElementById('q').oninput=e=>{window._q=e.target.value;draw()};document.getElementById('lane').onchange=e=>{window._lane=e.target.value;draw()};document.getElementById('only').onchange=e=>{window._only=e.target.value==='ready';draw()};
}

  }

 }else out+='<details class="details"><summary>レベル別スキル数値・CD</summary><p>未検証。資料のない値は掲載しません。</p></details>';
 out+='<details class="details"><summary>装備・アルカナ・スペル</summary>';

 else out+='<p>現行パッチのビルド資料未照合。</p>';
 out+='</details><details class="details"><summary>有利不利・対面対策</summary>';
 if(h.matchups){out+='<p><b>苦手とされる相手：</b>'+esc(h.matchups.unfavorable.join(' / '))+'</p><p><b>シナジー：</b>'+esc(h.matchups.synergy.join(' / '))+'</p><p class="muted">'+esc(h.matchups.note)+'</p>';}
 else out+='<p>対面別勝率・統計の信頼区間未照合。</p>';
 out+='</details>';
 if(h.sources?.length)out+='<details class="details"><summary>個別の照合出典と日付</summary><ul>'+h.sources.map(([label,url,date])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(label)+'</a>：'+esc(date)+'</li>').join('')+'</ul></details>';
 return out;
}
function details(h){const guide=!!h.plan;root.innerHTML='<button class="back" id="back">← ヒーロー一覧</button><div class="panel"><h1>'+esc(title(h))+'</h1><p class="muted">'+esc(h.role||'役割未照合')+' · '+esc(h.lane||'レーン未照合')+'</p>'+(guide?'<div>'+h.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+'<p class="notice">'+(h.skillLevels?'以下は外部資料による照合値。最新パッチでの国際版実機確認は未完了。':guide?'以下は初期攻略メモ。各技の係数・Lv別CD・勝率・最新装備は未検証。':'このヒーローの固有攻略は未検証。未確認の数値・スキル・レーン適性を推測で埋めていません。')+'</p></div><section class="panel"><h2>攻略・検証情報</h2>'+(guide?'<details class="details" open><summary>得意な行動・コンボの考え方</summary><p>'+esc(h.plan)+'</p></details><details class="details"><summary>弱点と対策</summary><p>'+esc(h.weak)+'</p></details><details class="details"><summary>ポケユナとの操作感比較</summary><p>'+esc(h.compare)+'</p></details>':'<p>スキルと対策の個別調査を準備中。</p>')+'<details class="details" '+(h.skills?.length?'open':'')+'><summary>パッシブ・スキル（'+(h.skills?.length||0)+'技記載）</summary>'+(h.skills?.length?h.skills.map(([t,d])=>'<details class="details"><summary>'+esc(t)+'</summary><p>'+esc(d)+'</p></details>').join(''):'<p>技構成と効果はまだ未検証。</p>')+'<p class="muted">資料を照合したレベル別数値は下の専用表に掲載。最新パッチでの実機照合は未完了。</p></details><details class="details"><summary>固有コンボ</summary><p>'+esc(h.combo||'未検証')+'</p></details>'+extra(h)+'<details class="details"><summary>スキル動画・解説動画</summary>'+(h.videos?.length?'<ul>'+h.videos.map(v=>'<li><a target="_blank" rel="noopener noreferrer" href="'+esc(v.url)+'">'+esc(v.title)+'</a> <small>('+esc(v.kind)+' / '+esc(v.date)+')</small></li>').join('')+'</ul><p class="muted">公式制作と確認できない動画を公式解説として扱いません。</p>':'<p>個別に確認済みの動画は未登録。</p>')+'<div class="links"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent('Honor of Kings '+h.name+' skill guide')+'">YouTubeで探す</a></div></details><details class="details"><summary>検証日・出典</summary><p>図鑑初公開：2026-11-14。'+esc(h.verified||'個別の技・数値は未検証。')+'</p><p>'+(h.source?'<a href="'+esc(h.source)+'" target="_blank" rel="noopener noreferrer">このキャラの技の照合資料</a>':'')+'</p><div class="links"><a href="https://world.honorofkings.com/ipworld/en/m/champion.html" target="_blank" rel="noopener noreferrer">公式ヒーローポータル</a><a href="https://hub-game.com/hok/en/heroes" target="_blank" rel="noopener noreferrer">ヒーロー一覧</a><a href="https://hokstats.gg/heroes/" target="_blank" rel="noopener noreferrer">ビルド資料</a></div></details></section>';document.getElementById('back').onclick=()=>{location.hash='';home()};window.scrollTo(0,0)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-hero]');if(b){location.hash='hero-'+b.dataset.hero;details(heroes.find(h=>h.id===Number(b.dataset.hero)))}});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#hero-(\d+)$/);if(m){const h=heroes.find(x=>x.id===Number(m[1]));h?details(h):home()}else home()});
const initial=location.hash.match(/^#hero-(\d+)$/);initial?details(heroes.find(x=>x.id===Number(initial[1]))||heroes[0]):home();
</script></body></html>
