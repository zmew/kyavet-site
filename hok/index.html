<script>

function home(){
 const q=window._q||'',lane=window._lane||'all',only=window._only||false;
 const filtered=heroes.filter(h=>(title(h)+' '+(h.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase())&&(lane==='all'||(h.lane||'').includes(lane))&&(!only||h.plan));

 document.getElementById('q').oninput=e=>{window._q=e.target.value;draw()};document.getElementById('lane').onchange=e=>{window._lane=e.target.value;draw()};document.getElementById('only').onchange=e=>{window._only=e.target.value==='ready';draw()};
}

function details(h){const guide=!!h.plan;root.innerHTML='<button class="back" id="back">← ヒーロー一覧</button><div class="panel"><h1>'+esc(title(h))+'</h1><p class="muted">'+esc(h.role||'役割未照合')+' · '+esc(h.lane||'レーン未照合')+'</p>'+(guide?'<div>'+h.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+'<p class="notice">'+(guide?'以下は初期攻略メモ。各技の係数・Lv別CD・勝率・最新装備は未検証。':'このヒーローの固有攻略は未検証。未確認の数値・スキル・レーン適性を推測で埋めていません。')+'</p></div><section class="panel"><h2>攻略・検証情報</h2>'+(guide?'<details class="details" open><summary>得意な行動・コンボの考え方</summary><p>'+esc(h.plan)+'</p></details><details class="details"><summary>弱点と対策</summary><p>'+esc(h.weak)+'</p></details><details class="details"><summary>ポケユナとの操作感比較</summary><p>'+esc(h.compare)+'</p></details>':'<p>スキルと対策の個別調査を準備中。</p>')+'<details class="details" '+(h.skills?.length?'open':'')+'><summary>パッシブ・スキル（'+(h.skills?.length||0)+'技記載）</summary>'+(h.skills?.length?h.skills.map(([t,d])=>'<details class="details"><summary>'+esc(t)+'</summary><p>'+esc(d)+'</p></details>').join(''):'<p>技構成と効果はまだ未検証。</p>')+'<p class="muted">全LvのCD・ダメージ・最新パッチでの実機照合は未完了。</p></details><details class="details"><summary>固有コンボ</summary><p>'+esc(h.combo||'未検証')+'</p></details><details class="details"><summary>5レーン適性</summary><p>Clash / Jungle / Mid / Farm / Roam：'+esc(h.lane||'全レーン未照合')+'（候補。採用率・勝率は未検証）</p></details><details class="details"><summary>装備・アルカナ・スペル</summary><p>現行パッチのビルド資料未照合。</p></details><details class="details"><summary>有利不利・対面対策</summary><p>対面別勝率・統計の信頼区間未照合。</p></details><details class="details"><summary>スキル動画・解説動画</summary><p>個別に確認済みの動画は未登録。</p><div class="links"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent('Honor of Kings '+h.name+' skill guide')+'">YouTubeで探す</a></div></details><details class="details"><summary>検証日・出典</summary><p>登録：2026-11-14。'+esc(h.verified||'個別の技・数値は未検証。')+'</p><p>'+(h.source?'<a href="'+esc(h.source)+'" target="_blank" rel="noopener noreferrer">このキャラの技の照合資料</a>':'')+'</p><div class="links"><a href="https://world.honorofkings.com/ipworld/en/m/champion.html" target="_blank" rel="noopener noreferrer">公式ヒーローポータル</a><a href="https://hub-game.com/hok/en/heroes" target="_blank" rel="noopener noreferrer">ヒーロー一覧</a><a href="https://hokstats.gg/heroes/" target="_blank" rel="noopener noreferrer">ビルド資料</a></div></details></section>';document.getElementById('back').onclick=()=>{location.hash='';home()};window.scrollTo(0,0)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-hero]');if(b){location.hash='hero-'+b.dataset.hero;details(heroes.find(h=>h.id===Number(b.dataset.hero)))}});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#hero-(\d+)$/);if(m){const h=heroes.find(x=>x.id===Number(m[1]));h?details(h):home()}else home()});
const initial=location.hash.match(/^#hero-(\d+)$/);initial?details(heroes.find(x=>x.id===Number(initial[1]))||heroes[0]):home();
</script></body></html>
