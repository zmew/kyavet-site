<script>
"use strict";
const heroes=JSON.parse(document.getElementById('catalog').textContent),root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const title=h=>h.jp?h.jp+' / '+h.name:h.name;
function home(){
 const q=window._q||'',lane=window._lane||'all',only=window._only||false;
 const filtered=heroes.filter(h=>(title(h)+' '+(h.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase())&&(lane==='all'||(h.lane||'').includes(lane))&&(!only||h.plan));
 root.innerHTML='<h1>Honor of Kings ヒーロー図鑑</h1><p class="muted">全ヒーローの日本語詳細攻略を整備するプロジェクト。検索・比較・検証状況の確認から使えます。</p><div class="notice"><b>制作版（2026-11-15）</b>：候補'+heroes.length+'エントリ（Flowbornの5形態を別件として含む）。公式の実装総数は未確定。技概要資料照合 '+heroes.filter(h=>h.skills?.length).length+'件、レベル別数値資料照合 '+heroes.filter(h=>h.skillLevels).length+'件。外部資料と実機検証を区別しています。<a href="ROSTER_AUDIT.md">ロスター検証記録</a></div><div class="filters"><input id="q" aria-label="ヒーロー検索" placeholder="ヒーロー名・特徴で検索" value="'+esc(q)+'"><select id="lane" aria-label="レーン絞り込み"><option value="all">全レーン／未照合を含む</option>'+['Clash','Jungle','Mid','Farm','Roam'].map(l=>'<option value="'+l+'" '+(lane===l?'selected':'')+'>'+l+'</option>').join('')+'</select><select id="only" aria-label="攻略整備状況"><option value="all">全キャラ</option><option value="ready" '+(only?'selected':'')+'>攻略メモあり</option></select></div><p id="count" class="muted">'+filtered.length+'件表示</p><div class="grid" id="cards">'+filtered.map(card).join('')+'</div><footer>出典：<a href="https://www.honorofkings.com/global-en/" target="_blank" rel="noopener noreferrer">HoK公式</a> ／ <a href="https://hub-game.com/hok/en/heroes" target="_blank" rel="noopener noreferrer">Hero roster (2026-11-06統計表記)</a> ／ <a href="https://hokstats.gg/heroes/" target="_blank" rel="noopener noreferrer">HoKStats</a>。非公式のファンガイド。情報の更新を保証するものではありません。</footer>';
 document.getElementById('q').oninput=e=>{window._q=e.target.value;draw()};document.getElementById('lane').onchange=e=>{window._lane=e.target.value;draw()};document.getElementById('only').onchange=e=>{window._only=e.target.value==='ready';draw()};
}
function card(h){return '<button class="tile" data-hero="'+h.id+'"><div class="name">'+esc(title(h))+'</div><div class="muted">'+esc(h.lane||'レーン未照合')+'</div><span class="tag">'+(h.skillLevels?'数値資料あり':h.plan?'攻略メモあり':'要検証')+'</span></button>'}
function draw(){const q=window._q||'',lane=window._lane||'all',only=window._only||false;const f=heroes.filter(h=>(title(h)+' '+(h.tags||[]).join(' ')).toLowerCase().includes(q.toLowerCase())&&(lane==='all'||(h.lane||'').includes(lane))&&(!only||h.plan));document.getElementById('cards').innerHTML=f.map(card).join('');document.getElementById('count').textContent=f.length+'件表示'}
function extra(h){
 const laneNames=['Clash','Jungle','Mid','Farm','Roam'];
 const laneRows=laneNames.map(l=>'<tr><th scope="row">'+esc(l)+'</th><td>'+esc(h.laneFit?.[l]||'未検証')+'</td></tr>').join('');
 let out='<details class="details"><summary>5レーン適性</summary><div class="scroll-table"><table class="data-table"><tbody>'+laneRows+'</tbody></table></div><p class="muted">候補・定性的判断と、実際の採用率/勝率は区別しています。</p></details>';
 if(h.skillLevels){
  out+='<details class="details" open><summary>レベル別スキル数値・CD（外部資料照合）</summary>';
  for(const [key,rows] of Object.entries(h.skillLevels)){
   const n=rows[0][1].length;
   out+='<h3>'+esc(key)+'（スキルLv1〜'+n+'）</h3><div class="scroll-table"><table class="data-table"><thead><tr><th scope="col">項目</th>'+Array.from({length:n},(_,i)=>'<th scope="col">Lv'+(i+1)+'</th>').join('')+'</tr></thead><tbody>';
   for(const [label,values] of rows){out+='<tr><th scope="row">'+esc(label)+'</th>'+values.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>';}
   out+='</tbody></table></div>';
  }
  out+='<p class="muted">'+esc(h.numericNote||'係数・最新パッチは未検証')+'</p></details>';
 }else out+='<details class="details"><summary>レベル別スキル数値・CD</summary><p>未検証。資料のない値は掲載しません。</p></details>';
 out+='<details class="details"><summary>装備・アルカナ・スペル</summary>';
 if(h.builds?.length){out+=h.builds.map(b=>'<h3>'+esc(b.name)+'</h3><p><b>装備：</b>'+esc(b.items.join(' → '))+'</p><p><b>アルカナ：</b>'+esc(b.arcana.join(' / '))+'</p><p><b>スペル：</b>'+esc(b.spell)+'</p><p class="muted">参照ビルド取得日：'+esc(b.recorded)+'。現パッチの最適解と保証しません。</p>').join('');}
 else out+='<p>現行パッチのビルド資料未照合。</p>';
 out+='</details><details class="details"><summary>有利不利・対面対策</summary>';
 if(h.matchups){out+='<p><b>苦手とされる相手：</b>'+esc(h.matchups.unfavorable.join(' / '))+'</p><p><b>シナジー：</b>'+esc(h.matchups.synergy.join(' / '))+'</p><p class="muted">'+esc(h.matchups.note)+'</p>';}
 else out+='<p>対面別勝率・統計の信頼区間未照合。</p>';
 out+='</details>';
 if(h.sources?.length)out+='<details class="details"><summary>個別の照合出典と日付</summary><ul>'+h.sources.map(([label,url,date])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(label)+'</a>：'+esc(date)+'</li>').join('')+'</ul></details>';
 return out;
}
function details(h){const guide=!!h.plan;root.innerHTML='<button class="back" id="back">← ヒーロー一覧</button><div class="panel"><h1>'+esc(title(h))+'</h1><p class="muted">'+esc(h.role||'役割未照合')+' · '+esc(h.lane||'レーン未照合')+'</p>'+(guide?'<div>'+h.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>':'')+'<p class="notice">'+(h.skillLevels?'以下は外部資料による照合値。最新パッチでの国際版実機確認は未完了。':guide?'以下は初期攻略メモ。各技の係数・Lv別CD・勝率・最新装備は未検証。':'このヒーローの固有攻略は未検証。未確認の数値・スキル・レーン適性を推測で埋めていません。')+'</p></div><section class="panel"><h2>攻略・検証情報</h2>'+(guide?'<details class="details" open><summary>得意な行動・コンボの考え方</summary><p>'+esc(h.plan)+'</p></details><details class="details"><summary>弱点と対策</summary><p>'+esc(h.weak)+'</p></details><details class="details"><summary>ポケユナとの操作感比較</summary><p>'+esc(h.compare)+'</p></details>':'<p>スキルと対策の個別調査を準備中。</p>')+'<details class="details" '+(h.skills?.length?'open':'')+'><summary>パッシブ・スキル（'+(h.skills?.length||0)+'技記載）</summary>'+(h.skills?.length?h.skills.map(([t,d])=>'<details class="details"><summary>'+esc(t)+'</summary><p>'+esc(d)+'</p></details>').join(''):'<p>技構成と効果はまだ未検証。</p>')+'<p class="muted">資料を照合したレベル別数値は下の専用表に掲載。最新パッチでの実機照合は未完了。</p></details><details class="details"><summary>固有コンボ</summary><p>'+esc(h.combo||'未検証')+'</p></details>'+extra(h)+'<details class="details"><summary>スキル動画・解説動画</summary><p>個別に確認済みの動画は未登録。</p><div class="links"><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent('Honor of Kings '+h.name+' skill guide')+'">YouTubeで探す</a></div></details><details class="details"><summary>検証日・出典</summary><p>登録：2026-11-14。'+esc(h.verified||'個別の技・数値は未検証。')+'</p><p>'+(h.source?'<a href="'+esc(h.source)+'" target="_blank" rel="noopener noreferrer">このキャラの技の照合資料</a>':'')+'</p><div class="links"><a href="https://world.honorofkings.com/ipworld/en/m/champion.html" target="_blank" rel="noopener noreferrer">公式ヒーローポータル</a><a href="https://hub-game.com/hok/en/heroes" target="_blank" rel="noopener noreferrer">ヒーロー一覧</a><a href="https://hokstats.gg/heroes/" target="_blank" rel="noopener noreferrer">ビルド資料</a></div></details></section>';document.getElementById('back').onclick=()=>{location.hash='';home()};window.scrollTo(0,0)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-hero]');if(b){location.hash='hero-'+b.dataset.hero;details(heroes.find(h=>h.id===Number(b.dataset.hero)))}});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#hero-(\d+)$/);if(m){const h=heroes.find(x=>x.id===Number(m[1]));h?details(h):home()}else home()});
const initial=location.hash.match(/^#hero-(\d+)$/);initial?details(heroes.find(x=>x.id===Number(initial[1]))||heroes[0]):home();
</script></body></html>
