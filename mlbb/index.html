 joy:[{id:'KiY9YBO2RQU',title:'ジョイEXP実戦解説（旧パッチ参考）',note:'2026年1月の参考動画。最新スキル数値は保証しません。'}],
 natalia:[{id:'l2eCaM7kWPE',title:'ナタリアのリメイク解説（試験版）',note:'Advanced Serverの動画。通常サーバーと混同しないでください。'}],
 kalea:[{id:'iPMNdmB3omk',title:'Hero Spotlight｜Kalea',note:'Moonton公式インドネシアチャンネル・2025-03-13。'}],
 sora:[{id:'fzY7qyp8ark',title:'Hero Spotlight｜Sora',note:'Moonton公式・2025-12-11。スキル・コンボを実演。'}],
 marcel:[{id:'k25RkKLguxM',title:'Hero Spotlight｜Marcel',note:'Moonton公式ミャンマーチャンネル・2026-03-04。'}],
 hirara:[{id:'OLndxtM4m0U',title:'Hero Spotlight｜Hirara',note:'Moonton公式・2026-06-11。扇の合成技を実演。'}]
};
function playVideo(slug,i){
 const v=(curatedVideos[slug]||[])[i], host=document.getElementById('v-'+slug+'-'+i);if(!v||!host)return;
 const frame=document.createElement('iframe');frame.title=v.title;frame.loading='lazy';frame.allowFullscreen=true;
 frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
 frame.referrerPolicy='strict-origin-when-cross-origin';frame.src='https://www.youtube-nocookie.com/embed/'+v.id;host.replaceChildren(frame);
}
function media(h){
 const videos=curatedVideos[h.slug]||[];
 return `<section class="panel" id="videos"><h2>技動画・解説動画</h2><p class="source">動画を開く操作をしたときのみYouTubeプレーヤーを読み込みます。実装日やパッチで技が変わる場合があります。</p>${videos.map((v,i)=>`<details class="details"><summary>${esc(v.title)}</summary><div class="inside"><p>${esc(v.note)}</p><div class="video-frame" id="v-${h.slug}-${i}"><button class="action" onclick="playVideo('${h.slug}',${i})">このページ内で再生</button></div><p><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">原典の動画</a></p></div></details>`).join('')||'<p>照合した固有動画はまだありません。未確認の映像を自動で掲載しない方針です。</p>'}<div class="ext"><a href="https://www.youtube.com/results?search_query=${encodeURIComponent('Mobile Legends '+h.name+' tutorial skills 2026')}" target="_blank" rel="noopener">追加動画を検索</a></div></section>`;
}
function guidePanel(h){
 const g=h.guide;if(!g)return '';
 const list=a=>Array.isArray(a)&&a.length?'<ul>'+a.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'<p class="source">この項目はまだ未検証です。</p>';
 const fold=(title,body,open)=>'<details class="details"'+(open?' open':'')+'><summary>'+title+'</summary><div class="inside">'+body+'</div></details>';
 const build='<p><b>装備候補：</b>'+esc((g.items||[]).join(' → ')||'未検証')+'</p><p><b>エンブレム：</b>'+esc(g.emblem||'未検証')+'</p><p><b>スペル：</b>'+esc(g.spell||'未検証')+'</p><p class="source">候補は統計や攻略資料を参照した一例。パッチ・相手の編成次第で変わります。</p>';
 const refs=(g.sources||[]).map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>').join('');
 return '<section class="panel guidepanel" id="guide"><h2>固有攻略・出典付き検証メモ</h2><p class="source">更新 2026-11-03。出典資料に基づく要約。最新パッチ全レベルの数値・実機確認は未完了。</p>'+(h.isPlayable===false?'<p class="previewtag">試験サーバーの先行ヒーロー／通常版未実装</p>':'')+(g.preview?'<p class="notice">'+esc(g.preview)+'</p>':'')+fold('固有コンボ・技順',list(g.combo),true)+fold('確認した秒数・ダメージ倍率',list(g.numbers))+fold('装備・エンブレム・スペル',build)+fold('得意状況／苦手・対策', '<h3>得意</h3>'+list(g.good)+'<h3>弱点・注意点</h3>'+list(g.bad)+'<h3>連携候補</h3>'+list(g.team))+'<p class="source">検証資料</p><div class="reflinks">'+refs+'</div></section>';
}
function details(h){current=h.slug;document.title=`${h.alias||h.name} | MLBB攻略大図鑑`;root.innerHTML=`<div class="btnrow"><button onclick="navHome()">← 全ヒーロー</button><button onclick="toggleFav('${h.slug}')">${fav.has(h.slug)?'★ お気に入り済み':'☆ お気に入りに追加'}</button><button onclick="toggleCmp('${h.slug}')">${cmp.includes(h.slug)?'✓ 比較に追加済み':'+ 3体比較に追加'}</button></div><div class="panel"><div class="hero-title"><h1>${name(h)}</h1><span class="tag alt">${esc(h.quality)}</span>${h.isPlayable===false?'<span class="previewtag">未実装</span>':''}</div><div class="lead">${esc(h.gimmick)}</div><div class="info"><div><span class="sub">ロール</span><b>${esc(h.role)}</b></div><div><span class="sub">主なレーン</span><b>${esc(h.extra.main||'確認中')}</b></div><div><span class="sub">兼任候補</span><b>${esc((h.extra.other||[]).join('・')||'未登録')}</b></div><div><span class="sub">主なCC</span><b>${esc(h.cc||'未登録')}</b></div></div><div class="toc" style="margin-top:15px"><a href="#skills" onclick="jump(event,'skills')">技</a><a href="#guide" onclick="jump(event,'guide')">固有攻略</a><a href="#plan" onclick="jump(event,'plan')">立ち回り</a><a href="#matchups" onclick="jump(event,'matchups')">相性</a><a href="#build" onclick="jump(event,'build')">装備</a><a href="#videos" onclick="jump(event,'videos')">動画</a><a href="#sources" onclick="jump(event,'sources')">出典</a></div></div><section class="panel" id="skills"><h2>技・特性の詳細</h2><p class="source">各技をタップして開閉。効果要約の確認レベル：${esc(h.skillLevel)}</p>${h.verified?`<div class="notice">確認日：${esc(h.verified.updated)}｜${esc(h.verified.patchStatus)}｜<a href="${esc(h.verified.source)}" target="_blank" rel="noopener">参照元</a></div>`:''}${(h.skillNames||skillTitles).map((t,i)=>`<details class="details" ${i===0?'open':''}><summary>${t}</summary><div class="inside">${esc((h.verified?.skills||h.skills)[i]||'仕様未照合。')}<p class="source">参考数値は「固有攻略」の検証メモを参照。全レベルの最新数値は未検証。</p></div></details>`).join('')}<div class="notice">最新パッチに対応した詳細数値はMLBBDex APIを使用して取得できる環境では追加確認できます。下の「最新データ読込」を押すと、パッシブ・各技の原文と数値記述をこのページ内に展開します（取得できなければ要約を維持）。</div><button class="action" id="loadBtn" onclick="loadLatest('${h.slug}')">最新スキルデータを同じページ内に読込</button><div id="fresh"></div></section>${guidePanel(h)}<section class="panel" id="plan"><h2>立ち回り・得意な状況</h2><div class="columns"><div class="item"><h3>何が得意？</h3><p>${esc(h.focus)}</p><p>${esc(h.extra.good)}</p></div><div class="item"><h3>どう動く？</h3><p>${esc(h.extra.play)}</p></div><div class="item"><h3>注意点・弱点</h3><p>${esc(h.extra.weak)}</p></div></div><h3>勝ちにつなぐ3つの手順</h3><ol><li>主レーンで育成とウェーブ管理を優先する。</li><li>得意な戦闘条件（${esc(h.extra.good)}）を作ってから仕掛ける。</li><li>キル後はタワー、タートル、ロード、敵ジャングルのいずれかにつなげる。</li></ol><p class="source">この手順は役割に基づく汎用的な戦略であり、固有コンボの実測結果ではありません。</p></section><section class="panel" id="matchups"><h2>有利・不利の考え方</h2><div class="columns"><div class="item"><h3>得意な状況</h3><p>${esc(h.extra.good)}</p></div><div class="item"><h3>不利になりやすい状況</h3><p>${esc(h.extra.bad)}</p></div></div><p class="source">対面キャラ名ごとの勝敗はランク・レーン・装備・更新日で変動するため、現在は検証済みデータのない組み合わせを断定していません。統計データの取り込みは次期対応。</p></section><section class="panel" id="build"><h2>装備・スペル・エンブレム</h2><p>役割：${esc(h.role)}　主なレーン：${esc(h.extra.main)}</p><div class="notice">具体的な6枠ビルドとタレントの最適解は、相手の編成やパッチの影響が大きいため、検証できていないヒーローについては推測で掲載していません。出典のあるデータが取得できた場合のみ反映します。</div><h3>何を優先して装備を選ぶ？</h3><p>火力タイプ：${esc(h.extra.dmg)}。敵の防御・回復・CC・バースト火力に応じて変更する。</p></section>${media(h)}<section class="panel" id="sources"><h2>データ・検証元</h2><p>効果：既存図鑑の日本語要約（手動編集）。正確な数値は元ゲームと一次的なパッチノートで照合が必要。</p>${links(h)}<p class="source">MLBBDexはコミュニティWiki由来のデータをCC BY-SAとして提供。詳細データを取得した場合は元出典を併記します。公開版は非公式ファンガイドです。</p></section>`;window.scrollTo(0,0)}
function jump(e,id){e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}function toggleFav(s){fav.has(s)?fav.delete(s):fav.add(s);save();details(get(s))}function toggleCmp(s){if(cmp.includes(s))cmp=cmp.filter(x=>x!==s);else if(cmp.length<3)cmp.push(s);else {alert('比較は最大3体です。比較ページで一度外してください。');return}save();details(get(s))}
async function loadLatest(slug){const el=document.getElementById('fresh'),btn=document.getElementById('loadBtn');btn.disabled=true;el.textContent='MLBBDexから読み込み中…';try{const r=await fetch(`https://mlbbdex.com/api/v1/heroes/${encodeURIComponent(slug)}`,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw new Error('HTTP '+r.status);const payload=await r.json();const d=payload.data||payload;let text='';if(Array.isArray(d.skills))text=d.skills.map(x=>`${x.name||'スキル'}: ${x.description||x.desc||JSON.stringify(x)}`).join('\n\n');else if(d.skills&&typeof d.skills==='object')text=Object.entries(d.skills).map(([k,x])=>`${k}: ${typeof x==='object'?(x.description||JSON.stringify(x)):x}`).join('\n\n');else text=JSON.stringify(d,null,2).slice(0,15000);el.innerHTML=`<details open class="details"><summary>取得した最新データ：${esc(d.name||slug)}（原文）</summary><div class="inside">${esc(text)}</div></details><p class="source">Source: ${esc(payload.source?.name||'MLBBDex API')} / ${esc(payload.source?.url||'https://mlbbdex.com/en/api-doc')} / アクセス時刻：${new Date().toLocaleString('ja-JP')}</p>`}catch(e){el.innerHTML=`<p class="notice">外部APIへ接続できませんでした。CORS・通信環境・API変更などの可能性があります。保存済みの要約はそのまま読めます。</p>`}finally{btn.disabled=false}}
function compare(){current='compare';root.innerHTML=`<h1>3体比較</h1><p class="lead">ヒーロー詳細画面で「比較に追加」を押してください。</p><div class="btnrow">${cmp.map(s=>`<button onclick="cmp=cmp.filter(v=>v!=='${s}');save();compare()">${name(get(s))} ×</button>`).join('')}<button onclick="cmp=[];save();compare()">比較をクリア</button></div>${cmp.length?`<div class="compare"><table><thead><tr><th>項目</th>${cmp.map(s=>`<th>${name(get(s))}</th>`).join('')}</tr></thead><tbody>${[['ロール',h=>h.role],['レーン',h=>ld(h)],['CC',h=>h.cc],['特殊能力',h=>h.gimmick],['得意',h=>h.extra.good],['苦手',h=>h.extra.weak],...skillTitles.map((x,i)=>[x,h=>h.skills[i]])].map(([label,fn])=>`<tr><th>${label}</th>${cmp.map(s=>`<td>${esc(fn(get(s)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="notice">まだ比較対象がありません。</p>'}`}
function about(){root.innerHTML=`<h1>出典・免責・更新</h1><div class="panel"><h2>収録範囲</h2><p>通常サーバー実装済み133体＋先行版Doriの能力を収録。ヒーローによって詳細情報の検証度が異なります。これは全技の数値検証が完了したデータベースではありません。</p><p>手動要約の収録数：${H.filter(h=>h.quality==='効果要約').length}体。概要のみ：${H.filter(h=>h.quality==='概要のみ').length}体。</p><h2>更新方針</h2><p>初版：2026-11-02、検証追加：2026-11-03。自動反映保証なし。数字や編成相性はパッチで変わります。取得できる場合は個別ページからMLBBDex APIの原文をその場で読み込めます。</p><h2>データ出典</h2><p><a href="https://mlbbdex.com/en/api-doc" target="_blank">MLBBDex Public API</a> — API配布データの出典はMobile Legends Wiki（CC BY-SA）。当サイトは非公式で、Moontonとは無関係です。</p><p>日本語の効果要約は既存の図鑑から引き継いだ編集文であり、転載したゲーム内説明文ではありません。</p><h2>公開とプライバシー</h2><p>お気に入りと比較は端末のブラウザにのみ保存。アカウント登録・トラッキングなし。外部APIを押したときのみデータ取得を試行します。</p></div>`}
function route(){const hash=location.hash.slice(1)||'/';if(hash.startsWith('/hero/')){let h=get(hash.split('/')[2]);h?details(h):home()}else if(hash==='/compare')compare();else if(hash==='/favorites'){filter.fav=true;home()}else if(hash==='/about')about();else home()}function navHome(){filter={q:'',role:'全て',lane:'全て',fav:false};location.hash='/';home()}function showCompare(){location.hash='/compare';compare()}function showFavorites(){filter.fav=true;location.hash='/favorites';home()}function showAbout(){location.hash='/about';about()}window.addEventListener('hashchange',route);route();
</script></body></html>
