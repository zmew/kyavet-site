ss="source">参考数値は「固有攻略」の検証メモを参照。全レベルの最新数値は未検証。</p></div></details>`).join('')}<div class="notice">外部コミュニティ資料（MLBBDex API）の原文を任意で読み込めます。APIの公開ドキュメントが示す同期日は2026-10-21で、現在のゲーム版より古い可能性があります。最新スキルを保証するものではなく、数値は必ずパッチ履歴やゲーム内画面と照合してください。通信失敗時も保存済み要約は残ります。</div><button class="action" id="loadBtn" onclick="loadLatest('${h.slug}')">外部スキル原文をページ内に表示</button><div id="fresh"></div></section>${metaPanel(h)}${patchPanel(h)}${auditPanel(h)}${guidePanel(h)}<section class="panel" id="plan"><h2>立ち回り・得意な状況</h2><div class="columns"><div class="item"><h3>何が得意？</h3><p>${esc(h.focus)}</p><p>${esc(h.extra.good)}</p></div><div class="item"><h3>どう動く？</h3><p>${esc(h.extra.play)}</p></div><div class="item"><h3>注意点・弱点</h3><p>${esc(h.extra.weak)}</p></div></div><h3>勝ちにつなぐ3つの手順</h3><ol><li>主レーンで育成とウェーブ管理を優先する。</li><li>得意な戦闘条件（${esc(h.extra.good)}）を作ってから仕掛ける。</li><li>キル後はタワー、タートル、ロード、敵ジャングルのいずれかにつなげる。</li></ol><p class="source">この手順は役割に基づく汎用的な戦略であり、固有コンボの実測結果ではありません。</p></section><section class="panel" id="matchups"><h2>有利・不利の考え方</h2><div class="columns"><div class="item"><h3>得意な状況</h3><p>${esc(h.extra.good)}</p></div><div class="item"><h3>不利になりやすい状況</h3><p>${esc(h.extra.bad)}</p></div></div>${h.meta2026?`<p class="source">対面名ごとの資料照合データは上の「資料照合：対面・装備・コンボ」に記載。パッチ2.2.16の参考で、勝敗を保証するものではありません。</p>`:`<p class="source">対面キャラ名ごとの検証がまだありません。ランクやレーン・装備・更新日により変動するため、未確認の勝敗を断定しません。</p>`}</section><section class="panel" id="build"><h2>装備・スペル・エンブレム</h2><p>役割：${esc(h.role)}　主なレーン：${esc(h.extra.main)}</p>${h.meta2026?`<div class="notice">上の「資料照合」欄に、パッチ2.2.16の主要3〜4装備・エンブレム・タレント・スペル採用例を掲載。6枠の最適ビルドや全ランクでの優位性は未検証です。</div>`:`<div class="notice">具体的な6枠ビルドとタレントの最適解は、相手の編成やパッチの影響が大きいため、検証できていないヒーローについては推測で掲載していません。出典のあるデータが取得できた場合のみ反映します。</div>`}<h3>何を優先して装備を選ぶ？</h3><p>火力タイプ：${esc(h.extra.dmg)}。敵の防御・回復・CC・バースト火力に応じて変更する。</p></section>${media(h)}<section class="panel" id="sources"><h2>データ・検証元</h2><p>効果：既存図鑑の日本語要約（手動編集）。正確な数値は元ゲームと一次的なパッチノートで照合が必要。各ヒーローのパッチ差分はゲーム内お知らせ由来の資料等から要約。</p>${links(h)}<p class="source">MLBBDexはコミュニティWiki由来のデータをCC BY-SAとして提供。詳細データを取得した場合は元出典を併記します。公開版は非公式ファンガイドです。</p></section>`;window.scrollTo(0,0)}
function jump(e,id){e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}function toggleFav(s){fav.has(s)?fav.delete(s):fav.add(s);save();details(get(s))}function toggleCmp(s){if(cmp.includes(s))cmp=cmp.filter(x=>x!==s);else if(cmp.length<3)cmp.push(s);else {alert('比較は最大3体です。比較ページで一度外してください。');return}save();details(get(s))}
async function loadLatest(slug){const el=document.getElementById('fresh'),btn=document.getElementById('loadBtn');btn.disabled=true;el.textContent='MLBBDexから読み込み中…';try{const r=await fetch(`https://mlbbdex.com/api/v1/heroes/${encodeURIComponent(slug)}`,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw new Error('HTTP '+r.status);const payload=await r.json();const d=payload.data||payload;let text='';if(Array.isArray(d.skills))text=d.skills.map(x=>`${x.name||'スキル'}: ${x.description||x.desc||JSON.stringify(x)}`).join('\n\n');else if(d.skills&&typeof d.skills==='object')text=Object.entries(d.skills).map(([k,x])=>`${k}: ${typeof x==='object'?(x.description||JSON.stringify(x)):x}`).join('\n\n');else text=JSON.stringify(d,null,2).slice(0,15000);el.innerHTML=`<details open class="details"><summary>外部APIの参考データ：${esc(d.name||slug)}（原文・要再検証）</summary><div class="inside">${esc(text)}</div></details><p class="source">Source: ${esc(payload.source?.name||'MLBBDex API')} / ${esc(payload.source?.url||'https://mlbbdex.com/en/api-doc')} / 取得時刻：${new Date().toLocaleString('ja-JP')} / 最新パッチへの追従は未保証</p>`}catch(e){el.innerHTML=`<p class="notice">外部APIへ接続できませんでした。CORS・通信環境・API変更などの可能性があります。保存済みの要約はそのまま読めます。</p>`}finally{btn.disabled=false}}
function compare(){current='compare';root.innerHTML=`<h1>3体比較</h1><p class="lead">ヒーロー詳細画面で「比較に追加」を押してください。</p><div class="btnrow">${cmp.map(s=>`<button onclick="cmp=cmp.filter(v=>v!=='${s}');save();compare()">${name(get(s))} ×</button>`).join('')}<button onclick="cmp=[];save();compare()">比較をクリア</button></div>${cmp.length?`<div class="compare"><table><thead><tr><th>項目</th>${cmp.map(s=>`<th>${name(get(s))}</th>`).join('')}</tr></thead><tbody>${[['ロール',h=>h.role],['レーン',h=>ld(h)],['CC',h=>h.cc],['特殊能力',h=>h.gimmick],['得意',h=>h.extra.good],['苦手',h=>h.extra.weak],...skillTitles.map((x,i)=>[x,h=>h.skills[i]])].map(([label,fn])=>`<tr><th>${label}</th>${cmp.map(s=>`<td>${esc(fn(get(s)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="notice">まだ比較対象がありません。</p>'}`}
function about(){root.innerHTML=`<h1>出典・免責・更新</h1><div class="panel"><h2>収録範囲</h2><p>通常サーバー133体＋試験サーバーDori 1体の計${H.length}体。ヒーローによって詳細情報の検証度が異なります。これは全技の数値検証が完了したデータベースではありません。</p><p>手動要約の収録数：${H.filter(h=>h.quality==='効果要約').length}体。パッチ変更履歴あり：${H.filter(h=>h.patchHistory?.length).length}体（9月・10月の主要更新中心）。固有メタ資料照合：${H.filter(h=>h.meta2026).length}体。</p><h2>更新方針</h2><p>初版：2026-11-02、26ヒーロー・28件のパッチ差分を2026-11-05に照合追加。2026-11-06に16体のコンボ・主要装備・相性候補、2026-11-07にディギー・ハカート・チップ・ベレリック・ロリータの追加照合、公式旧パッチ動画2本を追加。自動反映保証なし。数字や編成相性はパッチで変わります。取得できる場合は個別ページからMLBBDex APIの原文をその場で読み込めます。</p><h2>データ出典</h2><p><a href="https://mlbbdex.com/en/api-doc" target="_blank">MLBBDex Public API</a> — API配布データの出典はMobile Legends Wiki（CC BY-SA）。APIドキュメントにある同期日：2026-10-21、現在のゲーム内仕様を保証しません。当サイトは非公式で、Moontonとは無関係です。</p><p>日本語の効果要約は既存の図鑑から引き継いだ編集文であり、転載したゲーム内説明文ではありません。</p><h2>公開とプライバシー</h2><p>お気に入りと比較は端末のブラウザにのみ保存。アカウント登録・トラッキングなし。外部APIを押したときのみデータ取得を試行します。</p></div>`}
function route(){const hash=location.hash.slice(1)||'/';if(hash.startsWith('/hero/')){let h=get(hash.split('/')[2]);h?details(h):home()}else if(hash==='/compare')compare();else if(hash==='/favorites'){filter.fav=true;home()}else if(hash==='/about')about();else home()}function navHome(){filter={q:'',role:'全て',lane:'全て',fav:false};location.hash='/';home()}function showCompare(){location.hash='/compare';compare()}function showFavorites(){filter.fav=true;location.hash='/favorites';home()}function showAbout(){location.hash='/about';about()}window.addEventListener('hashchange',route);route();
</script></body></html>
